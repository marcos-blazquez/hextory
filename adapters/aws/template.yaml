# SAM design stub — DES-0005 (Q-AWS-5) + authorized smoke amendment.
# First-slice CI MUST NOT run `sam deploy` / `aws cloudformation deploy`.
# An authorized, manual smoke (operators opt in) may apply this stub only with
# hextory-* / hextory-public-* stack and table names (e.g. hextory-aws-smoke)
# in us-east-2. Do not share resources with other workloads in the same account;
# use hextory-* names only. Default CI proof remains moto (+ optional LocalStack).

AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Hextory AWS adapter stub (DES-0005). Uneployed by default; optional authorized
  manual smoke with hextory-* names only.

Parameters:
  JwtSecret:
    Type: String
    NoEcho: true
    Description: HS256 secret for bearer JWT (adapter-local)
  TableName:
    Type: String
    Default: hextory-aws-smoke

Globals:
  Function:
    Timeout: 30
    Runtime: python3.12
    Environment:
      Variables:
        HEXTORY_JWT_SECRET: !Ref JwtSecret
        HEXTORY_DYNAMODB_TABLE: !Ref TableName

Resources:
  HextoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH

  HextoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: adapters.aws.handlers.lambda_handler
      CodeUri: ../../
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref HextoryTable
      Events:
        Health:
          Type: HttpApi
          Properties:
            Path: /health
            Method: GET
        CreateRun:
          Type: HttpApi
          Properties:
            Path: /runs
            Method: POST
        GetRun:
          Type: HttpApi
          Properties:
            Path: /runs/{id}
            Method: GET
        ResumeRun:
          Type: HttpApi
          Properties:
            Path: /runs/{id}/resume
            Method: POST

Outputs:
  Note:
    Description: Uneployed by default — CI must not sam deploy; authorized hextory-* smoke is manual only
    Value: "DES-0005 — moto/LocalStack default; authorized hextory-* smoke opt-in"
