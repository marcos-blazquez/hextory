[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hextory"
version = "0.1.0"
description = "Hextory factory engine — hexagonal multi-agent orchestration (DES-0002 first slice)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Marcos Blazquez" }]
dependencies = [
  "pydantic>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]
# Optional LangGraph runner (adapters/local/langgraph_runtime.py). Core stays pure.
# Install for parity tests / CLI --runtime langgraph:
#   pip install -e ".[dev,langgraph]"
langgraph = [
  "langgraph>=0.2",
]
# On-prem HTTP adapter (adapters/onprem) — DES-0004. Core stays pure.
#   pip install -e ".[dev,onprem]"
onprem = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "PyJWT>=2.8",
  "psycopg[binary]>=3.1",
  "httpx>=0.27",
  "prometheus_client>=0.20",
]
# AWS Lambda / DynamoDB adapter (adapters/aws) — DES-0005. Core stays pure.
#   pip install -e ".[dev,aws]"
# moto required for CI parity; LocalStack Compose is optional smoke only.
aws = [
  "boto3>=1.34",
  "moto[dynamodb]>=5.0",
  "PyJWT>=2.8",
]

[project.scripts]
hextory = "adapters.local.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "adapters*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "behavior: BDD-style Given/When/Then scenarios",
  "integration: optional live-dependency tests (e.g. Postgres DSN)",
]
