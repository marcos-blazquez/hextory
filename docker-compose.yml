# Hextory on-prem stack (DES-0004-F) — API + Postgres.
# Operator notes: adapters/onprem/README.md
#
#   export HEXTORY_JWT_SECRET=dev-secret-change-me
#   docker compose up --build

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: hextory
      POSTGRES_PASSWORD: hextory
      POSTGRES_DB: hextory
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hextory -d hextory"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - hextory_pg:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: adapters/onprem/Dockerfile
    ports:
      - "8080:8080"
    environment:
      HEXTORY_DATABASE_URL: postgresql://hextory:hextory@postgres:5432/hextory
      HEXTORY_JWT_SECRET: ${HEXTORY_JWT_SECRET:-dev-secret-change-me}
      HEXTORY_ONPREM_HOST: 0.0.0.0
      HEXTORY_ONPREM_PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  hextory_pg:
